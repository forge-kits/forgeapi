name: Bug report
description: Something in forge-kits/forgeapi doesn't work as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps or code needed to reproduce the issue
      placeholder: |
        1. `forgeapi ...`
        2. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / traceback
      render: shell
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: forge-kits version
      placeholder: e.g. 1.3.2 (see `pip show forge-kits`)
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: e.g. 3.11.9
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Linux
        - Windows
        - macOS
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Config, related module, workarounds you tried
    validations:
      required: false
