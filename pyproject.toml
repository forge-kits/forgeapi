[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge-kits"
version = "1.4.1"
description = "FastAPI toolkit — auth, pagination, CLI generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.138",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "typer>=0.26",
    "jinja2>=3.1.6",
    "rich>=15.0",
    "tortoise-orm>=0.21",
    "aiosqlite>=0.21",
    "pyjwt>=2.13",
]

[project.optional-dependencies]
asyncpg  = ["asyncpg>=0.30"]
aiomysql = ["aiomysql>=0.2"]
redis    = ["redis>=4.0"]
mcp      = ["mcp>=1.0"]
s3       = ["boto3>=1.26"]
images   = ["Pillow>=10.0"]

[project.scripts]
forgeapi     = "forgeapi.cli.main:app"
forgeapi-mcp = "forgeapi.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["forgeapi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
